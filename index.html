<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketPass - Cyfrowy Portfel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        iosBg: '#F2F2F7',
                        iosDarkBg: '#000000',
                        iosCardDark: '#1C1C1E',
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #appContainer {
            touch-action: pan-y;
            overscroll-behavior: contain;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
            overscroll-behavior: contain;
        }
        
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-panel {
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes scanLine {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        .animate-scan {
            animation: scanLine 2s infinite linear;
        }
        
        @keyframes drawCheck {
            0% { stroke-dashoffset: 100; }
            100% { stroke-dashoffset: 0; }
        }
        .check-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="bg-iosBg dark:bg-iosDarkBg font-sans text-gray-900 dark:text-gray-100 h-[100dvh] w-full m-0 p-0 overflow-hidden select-none antialiased">

    <!-- Container -->
    <div id="appContainer" class="w-full h-full flex flex-col overflow-hidden relative transition-colors duration-300">
        
        <!-- iOS Status Bar -->
        <div class="w-full flex justify-between items-center px-6 py-3 text-sm font-semibold z-50 shrink-0 bg-transparent text-gray-900 dark:text-white transition-colors duration-300">
            <span id="currentTime" class="tracking-wider text-xs">9:41</span>
            <div class="flex items-center space-x-1.5 opacity-80">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[12px]"></i>
                <i class="fa-solid fa-battery-full text-[14px]"></i>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toastNotification" class="absolute top-14 left-4 right-4 z-[70] transform -translate-y-32 opacity-0 transition-all duration-300 pointer-events-none">
            <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border border-gray-200 dark:border-gray-700 p-3.5 rounded-2xl shadow-xl flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center text-sm">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div>
                    <h4 id="toastTitle" class="text-xs font-bold truncate">Powiadomienie</h4>
                    <p id="toastMessage" class="text-[11px] text-gray-500 dark:text-gray-400 truncate">Wiadomość</p>
                </div>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar relative">
            
            <!-- SCREEN: WALLET -->
            <section id="screenWallet" class="p-5 pb-24 space-y-5">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">PocketPass</h1>
                    <button onclick="switchTab('settings')" class="w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 flex items-center justify-center">
                        <i class="fa-solid fa-user"></i>
                    </button>
                </div>
                
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" oninput="searchCards(this.value)" placeholder="Szukaj w portfelu..." class="w-full bg-gray-200/70 dark:bg-gray-800/80 text-sm py-3 pl-10 pr-4 rounded-xl outline-none text-gray-900 dark:text-white placeholder-gray-500" />
                </div>

                <div class="flex justify-between items-center text-xs font-bold uppercase tracking-wider text-gray-400">
                    <span>Moje karty</span>
                    <button onclick="toggleCardStack()" id="btnToggleStack" class="text-blue-600 dark:text-blue-400 flex items-center space-x-1.5 font-semibold text-[11px] normal-case bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full border border-blue-200 dark:border-blue-800/50 active:scale-95 transition-transform">
                        <i id="iconToggleStack" class="fa-solid fa-up-down text-[10px]"></i>
                        <span id="txtToggleStack">Rozwiń karty</span>
                    </button>
                </div>
                <div id="cardsStackContainer" class="relative flex flex-col items-center transition-all duration-300">
                    <!-- Cards injected here -->
                </div>
            </section>

            <!-- SCREEN: HISTORY -->
            <section id="screenHistory" class="hidden p-5 pb-24 space-y-5">
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Historia</h1>
                <div id="transactionsList" class="space-y-3">
                    <!-- Transactions injected here -->
                </div>
            </section>

            <!-- SCREEN: ADD CARD -->
            <section id="screenAdd" class="hidden p-5 pb-24 space-y-5">
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Dodaj</h1>
                <div class="p-4 bg-blue-50 dark:bg-blue-900/30 rounded-2xl border border-blue-100 dark:border-blue-800 flex space-x-3">
                    <i class="fa-solid fa-info-circle text-blue-500 mt-0.5"></i>
                    <p class="text-xs text-blue-800 dark:text-blue-200">Wybierz opcję, aby wygenerować demonstracyjną kartę lub dodać własny bilet z pełnymi danymi.</p>
                </div>
                <div class="grid gap-3">
                    <button onclick="openAddCardModal('PAYMENT')" class="flex items-center p-4 bg-white dark:bg-iosCardDark rounded-2xl shadow-sm text-left active:scale-95 transition-transform">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-3"><i class="fa-solid fa-credit-card"></i></div>
                        <div class="flex-1"><h3 class="font-bold text-sm">Dodaj Kartę Płatniczą</h3><p class="text-xs text-gray-500">Kredytowa, Debetowa</p></div>
                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                    </button>
                    <button onclick="openAddCardModal('LOYALTY')" class="flex items-center p-4 bg-white dark:bg-iosCardDark rounded-2xl shadow-sm text-left active:scale-95 transition-transform">
                        <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mr-3"><i class="fa-solid fa-store"></i></div>
                        <div class="flex-1"><h3 class="font-bold text-sm">Dodaj Kartę Lojalnościową</h3><p class="text-xs text-gray-500">Sklepy, punkty, kawiarnie</p></div>
                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                    </button>
                    <button onclick="openAddTicketModal()" class="flex items-center p-4 bg-white dark:bg-iosCardDark rounded-2xl shadow-sm text-left active:scale-95 transition-transform border border-purple-200 dark:border-purple-800/40">
                        <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center mr-3"><i class="fa-solid fa-ticket"></i></div>
                        <div class="flex-1"><h3 class="font-bold text-sm">Dodaj Bilet (Lot, PKP, Event)</h3><p class="text-xs text-purple-600 dark:text-purple-400 font-semibold">Uzupełnij własne dane trasy / miejsca</p></div>
                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                    </button>
                </div>
            </section>

            <!-- SCREEN: SETTINGS -->
            <section id="screenSettings" class="hidden p-5 pb-24 space-y-5">
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Ustawienia</h1>
                <div class="bg-white dark:bg-iosCardDark rounded-2xl p-4 flex justify-between items-center shadow-sm">
                    <span class="font-medium text-sm">Tryb Ciemny</span>
                    <button onclick="toggleTheme()" class="w-12 h-6 bg-gray-300 dark:bg-green-500 rounded-full p-1 transition-colors relative">
                        <div class="w-4 h-4 bg-white rounded-full shadow-md transform translate-x-0 dark:translate-x-6 transition-transform"></div>
                    </button>
                </div>
                <button onclick="resetData()" class="w-full py-4 bg-red-50 dark:bg-red-900/30 text-red-600 font-bold rounded-2xl active:scale-95 transition-transform">
                    Zresetuj wszystkie dane
                </button>
            </section>
        </main>

        <!-- Bottom Nav -->
        <nav class="absolute bottom-0 left-0 right-0 glass-panel border-t border-gray-200/50 dark:border-gray-800/50 px-6 py-2 pb-6 z-40">
            <div class="flex justify-between items-center max-w-xs mx-auto">
                <button onclick="switchTab('wallet')" id="navWallet" class="flex flex-col items-center space-y-1 text-blue-600">
                    <i class="fa-solid fa-wallet text-xl"></i><span class="text-[10px] font-medium">Portfel</span>
                </button>
                <button onclick="switchTab('history')" id="navHistory" class="flex flex-col items-center space-y-1 text-gray-400">
                    <i class="fa-solid fa-clock-rotate-left text-xl"></i><span class="text-[10px] font-medium">Historia</span>
                </button>
                <button onclick="switchTab('add')" id="navAdd" class="flex flex-col items-center space-y-1 text-gray-400">
                    <i class="fa-solid fa-plus-circle text-xl"></i><span class="text-[10px] font-medium">Dodaj</span>
                </button>
                <button onclick="switchTab('settings')" id="navSettings" class="flex flex-col items-center space-y-1 text-gray-400">
                    <i class="fa-solid fa-gear text-xl"></i><span class="text-[10px] font-medium">Ustawienia</span>
                </button>
            </div>
        </nav>

        <!-- MODAL: CARD DETAILS -->
        <div id="modalCardDetails" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm flex flex-col justify-end transition-opacity duration-300 opacity-0">
            <div class="bg-iosBg dark:bg-iosDarkBg w-full h-[92%] rounded-t-[32px] flex flex-col shadow-2xl transform transition-transform duration-300 translate-y-full" id="cardDetailsContent">
                <div class="py-3 flex justify-center cursor-pointer" onclick="closeCardDetails()">
                    <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
                </div>
                <div class="flex-1 overflow-y-auto p-5 pb-10 space-y-6 no-scrollbar">
                    
                    <div id="modalCardVisual" class="w-full flex justify-center"></div>

                    <div id="paymentActionContainer" class="hidden">
                        <button onclick="openPaymentDemo()" class="w-full py-4 bg-black dark:bg-white text-white dark:text-black font-bold text-lg rounded-2xl shadow-lg active:scale-95 transition-transform flex justify-center items-center space-x-2">
                            <i class="fa-solid fa-wifi rotate-90"></i>
                            <span>Zapłać zbliżeniowo</span>
                        </button>
                    </div>

                    <div id="qrActionContainer" class="bg-white dark:bg-iosCardDark p-6 rounded-3xl text-center space-y-4 shadow-sm hidden">
                        <div class="text-xs font-bold uppercase tracking-wider text-gray-400">Kod do skanowania</div>
                        <div class="flex justify-center opacity-80"><i class="fa-solid fa-qrcode text-6xl dark:text-white"></i></div>
                        <button onclick="alert('Demo: Kod wyświetlony poprawnie')" class="w-full py-3 bg-gray-100 dark:bg-gray-800 text-sm font-bold rounded-xl">Powiększ kod</button>
                    </div>
                    
                    <button onclick="deleteCurrentCard()" class="w-full py-4 text-red-500 font-bold bg-white dark:bg-iosCardDark rounded-2xl shadow-sm active:scale-95 transition-transform">
                        Usuń z portfela
                    </button>
                </div>
            </div>
        </div>

        <!-- MODAL: ADD TICKET FORM -->
        <div id="modalAddTicket" class="fixed inset-0 z-[80] hidden bg-black/60 backdrop-blur-sm flex flex-col justify-end transition-opacity duration-300 opacity-0">
            <div class="bg-iosBg dark:bg-iosDarkBg w-full max-h-[90%] rounded-t-[32px] flex flex-col shadow-2xl transform transition-transform duration-300 translate-y-full" id="addTicketContent">
                <div class="py-4 flex justify-between items-center px-6 border-b border-gray-200 dark:border-gray-800">
                    <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center space-x-2">
                        <i class="fa-solid fa-ticket text-purple-500"></i>
                        <span>Dodaj bilet</span>
                    </h2>
                    <button onclick="closeAddTicketModal()" class="w-8 h-8 bg-gray-200 dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form id="formAddTicket" onsubmit="handleSaveTicket(event)" class="p-6 overflow-y-auto space-y-4 no-scrollbar">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Typ biletu</label>
                        <select id="ticketCategory" onchange="updateTicketFields()" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm font-medium outline-none text-gray-900 dark:text-white">
                            <option value="FLIGHT">✈️ Bilet lotniczy (Karta pokładowa)</option>
                            <option value="TRAIN">🚆 Bilet kolejowy (Pociąg / PKP)</option>
                            <option value="EVENT">🎟️ Bilet na wydarzenie / Koncert / Kino</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1" id="lblIssuer">Przewoźnik / Organizator</label>
                        <input type="text" id="ticketIssuer" required placeholder="np. LOT, PKP Intercity, Cinema City" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                    </div>

                    <div class="grid grid-cols-2 gap-3" id="rowRoute">
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-1" id="lblFrom">Stacja / Lotnisko startowe</label>
                            <input type="text" id="ticketFrom" placeholder="np. WAW / Warszawa" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-1" id="lblTo">Stacja / Lotnisko docelowe</label>
                            <input type="text" id="ticketTo" placeholder="np. LHR / Gdańsk" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                        </div>
                    </div>

                    <div id="rowEventTitle" class="hidden">
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nazwa wydarzenia lub filmu</label>
                        <input type="text" id="ticketEventName" placeholder="np. Koncert Open'er / Avatar 3" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Data i godzina</label>
                            <input type="text" id="ticketDate" required placeholder="np. 15 Sie, 18:30" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-1" id="lblDetails">Miejsce / Seat / Gate</label>
                            <input type="text" id="ticketDetails" placeholder="np. Bramka B12, Msc 14A" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Pasażer / Posiadacz</label>
                        <input type="text" id="ticketHolder" value="JAN KOWALSKI" required class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Motyw graficzny biletu</label>
                        <select id="ticketColor" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm font-medium outline-none text-gray-900 dark:text-white">
                            <option value="bg-gradient-to-br from-sky-500 to-blue-900">🔵 Niebieski (Lotniczy)</option>
                            <option value="bg-gradient-to-br from-purple-600 to-indigo-950">🟣 Fioletowy (VIP / Event)</option>
                            <option value="bg-gradient-to-br from-emerald-600 to-teal-900">🟢 Szmaragdzisty (Kolej / PKP)</option>
                            <option value="bg-gradient-to-br from-rose-600 to-amber-800">🔴 Ciepły (Kino / Teatr)</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full py-4 bg-purple-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-transform mt-4">
                        Zapisz bilet w PocketPass
                    </button>
                </form>
            </div>
        </div>

        <div id="modalAddCard" class="fixed inset-0 z-[80] hidden bg-black/60 backdrop-blur-sm flex flex-col justify-end transition-opacity duration-300 opacity-0">
            <div class="bg-iosBg dark:bg-iosDarkBg w-full max-h-[90%] rounded-t-[32px] flex flex-col shadow-2xl transform transition-transform duration-300 translate-y-full" id="addCardContent">
                <div class="py-4 flex justify-between items-center px-6 border-b border-gray-200 dark:border-gray-800">
                    <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center space-x-2">
                        <i class="fa-solid fa-credit-card text-blue-500"></i>
                        <span>Dodaj kartę</span>
                    </h2>
                    <button onclick="closeAddCardModal()" class="w-8 h-8 bg-gray-200 dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form id="formAddCard" onsubmit="handleSaveCard(event)" class="p-6 overflow-y-auto space-y-4 no-scrollbar">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Typ karty</label>
                        <select id="cardTypeSelect" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm font-medium outline-none text-gray-900 dark:text-white">
                            <option value="PAYMENT">💳 Karta Płatnicza (Debet/Kredyt)</option>
                            <option value="LOYALTY">🛍️ Karta Lojalnościowa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Wydawca / Sklep</label>
                        <input type="text" id="cardIssuerInput" required placeholder="np. mBank, Biedronka" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Numer karty (lub ID)</label>
                        <input type="text" id="cardNumberInput" required placeholder="**** **** **** 1234" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Imię i nazwisko</label>
                        <input type="text" id="cardHolderInput" value="JAN KOWALSKI" required class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none text-gray-900 dark:text-white" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Kolor tła</label>
                        <select id="cardColorSelect" class="w-full bg-white dark:bg-iosCardDark border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm font-medium outline-none text-gray-900 dark:text-white">
                            <option value="bg-gradient-to-br from-gray-800 to-black">⚫ Premium (Czarny)</option>
                            <option value="bg-gradient-to-br from-blue-600 to-indigo-900">🔵 Niebieski</option>
                            <option value="bg-gradient-to-br from-rose-600 to-red-900">🔴 Czerwony</option>
                            <option value="bg-gradient-to-br from-emerald-500 to-teal-800">🟢 Zielony</option>
                            <option value="bg-gradient-to-br from-amber-600 to-orange-900">🟠 Złoty / Pomarańczowy</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-transform mt-4">
                        Dodaj do portfela
                    </button>
                </form>
            </div>
        </div>

        <div id="modalPayment" class="fixed inset-0 z-[100] hidden flex-col items-center justify-between bg-black/80 backdrop-blur-md p-6 pb-20 transition-opacity duration-300 opacity-0">
            <div class="w-full flex justify-end">
                <button onclick="closePaymentDemo()" class="w-10 h-10 bg-gray-800/80 hover:bg-gray-700 rounded-full flex items-center justify-center text-white mt-8 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="w-full text-center text-white/90 text-lg font-medium tracking-wide mt-4">
                Zbliż do czytnika
            </div>

            <!-- Wybrana Karta zsuwająca się na górę -->
            <div id="paymentCardContainer" class="w-full max-w-sm mt-8 mb-auto transition-transform duration-500 scale-95 opacity-0">
                <!-- Karta zostanie dodana przez JS -->
            </div>

            <div class="w-full pb-10 flex flex-col items-center justify-center">
                <div id="paymentStatusIcon" class="w-32 h-32 relative flex items-center justify-center bg-gray-900/50 rounded-[32px] backdrop-blur-xl border border-white/10 shadow-2xl">
                    
                    <!-- Ikona Face ID i efekt skanowania -->
                    <div id="faceIdIcon" class="flex flex-col items-center justify-center">
                        <div class="relative">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-blue-400">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3M9 9h.01M15 9h.01M12 15a3 3 0 00-3-3m6 0a3 3 0 00-3 3" />
                            </svg>
                            <!-- Kreska skanujaca (laser) -->
                            <div class="absolute top-0 left-0 right-0 h-1 bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.8)] animate-scan rounded-full"></div>
                        </div>
                        <div class="text-blue-400 text-[10px] mt-3 font-bold uppercase tracking-widest">Face ID</div>
                    </div>

                    <!-- Zielony Haczyk potwierdzenia -->
                    <div id="successIcon" class="hidden flex-col items-center justify-center">
                        <div class="w-12 h-12 rounded-full border-4 border-green-500 flex items-center justify-center bg-green-500/20">
                            <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path class="check-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <div class="text-green-400 text-[10px] mt-3 font-bold uppercase tracking-widest">Gotowe</div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let cards = [
            { id: 'c1', type: 'PAYMENT', issuer: 'NexoBank', number: '**** **** **** 4281', holder: 'JAN KOWALSKI', bg: 'bg-gradient-to-br from-gray-800 to-black', text: 'text-white' },
            { id: 'c2', type: 'PAYMENT', issuer: 'FinTech Plus', number: '**** **** **** 8820', holder: 'JAN KOWALSKI', bg: 'bg-gradient-to-br from-blue-600 to-indigo-900', text: 'text-white' },
            { id: 'c3', type: 'TICKET', subType: 'FLIGHT', issuer: 'SkyAirlines', number: 'FLIGHT SK-402', holder: 'JAN KOWALSKI', from: 'WAW', to: 'LHR', details: 'Gate B14 • Msc 12A', bg: 'bg-gradient-to-br from-sky-500 to-blue-900', text: 'text-white' },
            { id: 'c4', type: 'LOYALTY', issuer: 'CoffeeHouse', number: 'ID: 884-219', holder: 'JAN KOWALSKI', bg: 'bg-gradient-to-br from-amber-700 to-orange-900', text: 'text-white' }
        ];
        
        let transactions = [
            { id: 't1', merchant: 'Żabka', amount: '12,50 PLN', date: 'Dzisiaj, 14:30', icon: 'fa-shopping-basket' },
            { id: 't2', merchant: 'Uber Eats', amount: '65,00 PLN', date: 'Wczoraj, 19:15', icon: 'fa-burger' }
        ];

        let currentTab = 'wallet';
        let currentSelectedCard = null;
        let isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isExpandedStack = false; // Rozwijanie kart bez przesuwania

        // --- Initialization ---
        function init() {
            updateTheme();
            renderCards(cards);
            renderTransactions();
            updateTime();
            setInterval(updateTime, 60000);
        }

        // --- Toggle Expanded Cards Stack ---
        function toggleCardStack() {
            isExpandedStack = !isExpandedStack;
            const btnText = document.getElementById('txtToggleStack');
            const btnIcon = document.getElementById('iconToggleStack');
            
            if (isExpandedStack) {
                btnText.innerText = 'Zwiń karty';
                btnIcon.className = 'fa-solid fa-compress text-[10px]';
            } else {
                btnText.innerText = 'Rozwiń karty';
                btnIcon.className = 'fa-solid fa-up-down text-[10px]';
            }
            renderCards(cards);
        }

        // --- Core Rendering ---
        function generateCardHTML(card, isStacked = false) {
            const isPayment = card.type === 'PAYMENT';
            const isTicket = card.type === 'TICKET';
            
            let icon = '<i class="fa-solid fa-credit-card text-2xl"></i>';
            if (isPayment) {
                icon = '<i class="fa-brands fa-cc-visa text-3xl"></i>';
            } else if (card.type === 'LOYALTY') {
                icon = '<i class="fa-solid fa-mug-hot text-2xl"></i>';
            } else if (isTicket) {
                if (card.subType === 'FLIGHT') icon = '<i class="fa-solid fa-plane text-2xl"></i>';
                else if (card.subType === 'TRAIN') icon = '<i class="fa-solid fa-train text-2xl"></i>';
                else icon = '<i class="fa-solid fa-ticket text-2xl"></i>';
            }

            const heightClass = isStacked ? 'h-52' : 'h-56';
            
            return `
                <div class="w-full rounded-[24px] p-6 shadow-xl relative overflow-hidden ${card.bg} ${card.text} ${heightClass} flex flex-col justify-between">
                    <!-- Overlay noise -->
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white to-transparent pointer-events-none"></div>
                    
                    <div class="relative z-10 flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-xl tracking-wide">${card.issuer}</h3>
                            <span class="text-[10px] uppercase tracking-widest opacity-80">${isTicket ? (card.subType || 'BILET') : card.type}</span>
                        </div>
                        ${icon}
                    </div>
                    
                    <div class="relative z-10 my-auto">
                        ${isTicket && card.from && card.to ? `
                            <div class="flex items-center justify-between my-1">
                                <span class="text-2xl font-black tracking-wider">${card.from}</span>
                                <div class="flex-1 px-3 flex items-center justify-center opacity-70">
                                    <div class="h-0.5 bg-white/40 w-full relative flex items-center justify-center">
                                        <i class="fa-solid ${card.subType === 'TRAIN' ? 'fa-train' : 'fa-plane'} text-xs bg-transparent px-1"></i>
                                    </div>
                                </div>
                                <span class="text-2xl font-black tracking-wider">${card.to}</span>
                            </div>
                        ` : `
                            <div class="font-mono text-lg tracking-[0.2em]">${card.number}</div>
                        `}
                    </div>

                    <div class="relative z-10">
                        <div class="flex justify-between items-end">
                            <div>
                                <div class="text-[9px] uppercase opacity-70 mb-0.5">${isTicket ? 'Pasażer / Uczestnik' : 'Posiadacz'}</div>
                                <div class="font-semibold text-sm tracking-wide">${card.holder}</div>
                            </div>
                            <div class="text-right">
                                ${isPayment ? `
                                    <i class="fa-solid fa-wifi rotate-90 text-lg opacity-80"></i>
                                ` : `
                                    <div class="text-xs opacity-90 font-medium">${card.details || ''}</div>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCards(cardsToRender) {
            const container = document.getElementById('cardsStackContainer');
            container.innerHTML = '';
            
            if (cardsToRender.length === 0) {
                container.innerHTML = '<p class="text-gray-500 mt-10 text-sm">Brak kart.</p>';
                return;
            }

            cardsToRender.forEach((card, index) => {
                // Rozwijanie bez konieczności ciągłego przesuwania palcem
                const marginTop = (index === 0) ? '0' : (isExpandedStack ? '12px' : '-130px');
                const zIndex = index;
                
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'w-full transition-all duration-300 hover:-translate-y-2 cursor-pointer';
                cardWrapper.style.marginTop = marginTop;
                cardWrapper.style.zIndex = zIndex;
                cardWrapper.onclick = () => openCardDetails(card);
                
                cardWrapper.innerHTML = generateCardHTML(card, true);
                container.appendChild(cardWrapper);
            });
        }

        // --- Modal Dodawania Biletów ---
        function openAddTicketModal() {
            const modal = document.getElementById('modalAddTicket');
            const content = document.getElementById('addTicketContent');
            updateTicketFields();
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }

        function closeAddTicketModal() {
            const modal = document.getElementById('modalAddTicket');
            const content = document.getElementById('addTicketContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function updateTicketFields() {
            const cat = document.getElementById('ticketCategory').value;
            const rowRoute = document.getElementById('rowRoute');
            const rowEventTitle = document.getElementById('rowEventTitle');
            const lblIssuer = document.getElementById('lblIssuer');
            
            if (cat === 'EVENT') {
                rowRoute.classList.add('hidden');
                rowEventTitle.classList.remove('hidden');
                lblIssuer.innerText = 'Organizator / Kino / Teatr';
            } else {
                rowRoute.classList.remove('hidden');
                rowEventTitle.classList.add('hidden');
                lblIssuer.innerText = cat === 'FLIGHT' ? 'Linia Lotnicza' : 'Przewoźnik Kolejowy';
            }
        }

        function handleSaveTicket(e) {
            e.preventDefault();
            const cat = document.getElementById('ticketCategory').value;
            const issuer = document.getElementById('ticketIssuer').value;
            const holder = document.getElementById('ticketHolder').value;
            const date = document.getElementById('ticketDate').value;
            const details = document.getElementById('ticketDetails').value;
            const bg = document.getElementById('ticketColor').value;
            
            let from = '', to = '', eventName = '';
            if (cat === 'EVENT') {
                eventName = document.getElementById('ticketEventName').value;
            } else {
                from = document.getElementById('ticketFrom').value;
                to = document.getElementById('ticketTo').value;
            }

            const newTicketCard = {
                id: 'c' + Date.now(),
                type: 'TICKET',
                subType: cat,
                issuer: issuer || (cat === 'EVENT' ? 'Event Pass' : 'Transport'),
                number: eventName || (from + ' -> ' + to),
                from: from,
                to: to,
                holder: holder || 'JAN KOWALSKI',
                details: `${date} ${details ? '• ' + details : ''}`,
                bg: bg,
                text: 'text-white'
            };

            cards.unshift(newTicketCard);
            renderCards(cards);
            closeAddTicketModal();
            showToast('Dodano bilet', 'Bilet został pomyślnie dodany do portfela.');
            switchTab('wallet');
        }

        function deleteCurrentCard() {
            if(currentSelectedCard) {
                cards = cards.filter(c => c.id !== currentSelectedCard.id);
                renderCards(cards);
                closeCardDetails();
                showToast('Usunięto', 'Karta została usunięta z portfela.');
            }
        }

        function resetData() {
            cards = [];
            transactions = [];
            renderCards(cards);
            renderTransactions();
            showToast('Zresetowano', 'Wszystkie dane zostały wyczyszczone.');
        }

        // --- Utils ---
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            updateTheme();
        }

        function updateTheme() {
            if(isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function showToast(title, message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            
            toast.classList.remove('-translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.add('-translate-y-32', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        function switchTab(tabId) {
            currentTab = tabId;
            ['wallet', 'history', 'add', 'settings'].forEach(t => {
                document.getElementById('screen' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
                const navItem = document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1));
                navItem.classList.remove('text-blue-600', 'dark:text-blue-400');
                navItem.classList.add('text-gray-400');
            });
            
            document.getElementById('screen' + tabId.charAt(0).toUpperCase() + tabId.slice(1)).classList.remove('hidden');
            const activeNav = document.getElementById('nav' + tabId.charAt(0).toUpperCase() + tabId.slice(1));
            activeNav.classList.remove('text-gray-400');
            activeNav.classList.add('text-blue-600', 'dark:text-blue-400');
        }

        function searchCards(query) {
            if(!query) {
                renderCards(cards);
                return;
            }
            const filtered = cards.filter(c => 
                c.issuer.toLowerCase().includes(query.toLowerCase()) || 
                (c.number && c.number.toLowerCase().includes(query.toLowerCase())) ||
                (c.type && c.type.toLowerCase().includes(query.toLowerCase()))
            );
            renderCards(filtered);
        }

        function updateTime() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            const timeEl = document.getElementById('currentTime');
            if(timeEl) timeEl.innerText = `${h}:${m}`;
        }

        function renderTransactions() {
            const list = document.getElementById('transactionsList');
            if(!list) return;
            
            if(transactions.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-sm">Brak historii transakcji.</p>';
                return;
            }
            
            list.innerHTML = transactions.map(t => `
                <div class="flex justify-between items-center bg-white dark:bg-iosCardDark p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300">
                            <i class="fa-solid ${t.icon}"></i>
                        </div>
                        <div>
                            <p class="font-bold text-sm text-gray-900 dark:text-white">${t.merchant}</p>
                            <p class="text-[11px] text-gray-500">${t.date}</p>
                        </div>
                    </div>
                    <span class="font-bold text-gray-900 dark:text-white">${t.amount}</span>
                </div>
            `).join('');
        }

        function openCardDetails(card) {
            currentSelectedCard = card;
            const modal = document.getElementById('modalCardDetails');
            const content = document.getElementById('cardDetailsContent');
            const visual = document.getElementById('modalCardVisual');
            const payAction = document.getElementById('paymentActionContainer');
            const qrAction = document.getElementById('qrActionContainer');

            visual.innerHTML = `<div class="w-full">${generateCardHTML(card, false)}</div>`;

            if (card.type === 'PAYMENT') {
                payAction.classList.remove('hidden');
                qrAction.classList.add('hidden');
            } else {
                payAction.classList.add('hidden');
                qrAction.classList.remove('hidden');
            }

            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }

        function closeCardDetails() {
            const modal = document.getElementById('modalCardDetails');
            const content = document.getElementById('cardDetailsContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // --- Logika dla dodawania kart platniczych i lojalnosciowych ---
        function openAddCardModal(type = 'PAYMENT') {
            const modal = document.getElementById('modalAddCard');
            const content = document.getElementById('addCardContent');
            document.getElementById('cardTypeSelect').value = type;
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }

        function closeAddCardModal() {
            const modal = document.getElementById('modalAddCard');
            const content = document.getElementById('addCardContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function handleSaveCard(e) {
            e.preventDefault();
            const type = document.getElementById('cardTypeSelect').value;
            const issuer = document.getElementById('cardIssuerInput').value;
            const number = document.getElementById('cardNumberInput').value;
            const holder = document.getElementById('cardHolderInput').value;
            const bg = document.getElementById('cardColorSelect').value;

            const newCard = {
                id: 'c' + Date.now(),
                type: type,
                issuer: issuer,
                number: number,
                holder: holder,
                bg: bg,
                text: 'text-white'
            };

            cards.unshift(newCard);
            renderCards(cards);
            closeAddCardModal();
            showToast('Dodano kartę', 'Karta została pomyślnie zapisana.');
            switchTab('wallet');
            
            document.getElementById('formAddCard').reset();
        }

        // --- Logika dla Face ID (Platnosc Zblizeniowa) ---
        function openPaymentDemo() {
            if(!currentSelectedCard) return;
            
            closeCardDetails(); // Skrycie panelu szczegolow przed otwarciem platnosci
            
            const modal = document.getElementById('modalPayment');
            const cardContainer = document.getElementById('paymentCardContainer');
            const faceIdIcon = document.getElementById('faceIdIcon');
            const successIcon = document.getElementById('successIcon');
            
            cardContainer.innerHTML = generateCardHTML(currentSelectedCard, false);
            
            faceIdIcon.classList.remove('hidden');
            faceIdIcon.classList.add('flex');
            successIcon.classList.add('hidden');
            successIcon.classList.remove('flex');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            
            setTimeout(() => {
                cardContainer.classList.remove('scale-95', 'opacity-0');
                cardContainer.classList.add('scale-100', 'opacity-100');
            }, 50);

            // Czas 2 sekund na "skanowanie" twarzy 
            setTimeout(() => {
                faceIdIcon.classList.add('hidden');
                faceIdIcon.classList.remove('flex');
                
                successIcon.classList.remove('hidden');
                successIcon.classList.add('flex');
                
                if (navigator.vibrate) navigator.vibrate(50);
                
                transactions.unshift({
                    id: 't' + Date.now(),
                    merchant: currentSelectedCard.issuer + ' Pay',
                    amount: '- ' + (Math.floor(Math.random() * 200) + 5) + ',00 PLN',
                    date: 'Przed chwilą',
                    icon: 'fa-cart-shopping'
                });
                renderTransactions();
                
                setTimeout(() => {
                    closePaymentDemo();
                }, 1500);
            }, 2000); 
        }

        function closePaymentDemo() {
            const modal = document.getElementById('modalPayment');
            const cardContainer = document.getElementById('paymentCardContainer');
            
            modal.classList.add('opacity-0');
            cardContainer.classList.remove('scale-100', 'opacity-100');
            cardContainer.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        // --- Run ---
        window.onload = init;
    </script>
</body>
</html>
